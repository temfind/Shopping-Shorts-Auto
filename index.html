<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>템 발견소</title>
<meta name="description" content="영상에서 본 그 아이템, 여기 다 모아뒀어요">
<meta property="og:title" content="템 발견소">
<meta property="og:description" content="영상에서 본 그 아이템, 여기 다 모아뒀어요">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--navy:#1b2a5e;--orange:#ff7a1a;--bg:#fffaf5;--card:#fff;--line:#eadfd2;--mute:#6b7280}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#1f2433;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;padding:14px 0 6px}
h1{margin:0;font-size:28px;font-weight:800;color:var(--navy);letter-spacing:-.5px}
h1 span{color:var(--orange)}
.sub{margin:8px 0 0;font-size:15px;color:var(--navy)}
.notice{margin:14px 0;font-size:12px;line-height:1.5;color:var(--mute);text-align:center}
.search{position:relative;margin:14px 0 16px}
.search input{width:100%;height:46px;border:2px solid var(--navy);border-radius:23px;padding:0 18px;font:inherit;font-size:16px;background:#fff;outline:none}
.search input:focus{border-color:var(--orange)}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(27,42,94,.06)}
.thumb{flex:0 0 96px;width:96px;aspect-ratio:9/16;border-radius:10px;object-fit:cover;background:#eee;display:block}
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.date{font-size:12px;color:var(--mute)}
.title{margin:4px 0 8px;font-size:15px;font-weight:700;line-height:1.4;color:var(--navy);word-break:keep-all}
.kw{align-self:flex-start;font-size:12px;color:var(--orange);font-weight:700;margin-bottom:8px}
.pname{font-size:13px;color:#374151;margin:0 0 8px}
.btns{margin-top:auto}
.btn{display:block;text-align:center;text-decoration:none;background:var(--orange);color:#fff;font-weight:800;font-size:16px;padding:13px 10px;border-radius:12px;margin-bottom:6px}
.btn:active{background:#e86a0e}
.reel{display:block;text-align:center;font-size:13px;color:var(--navy);text-decoration:underline;margin:2px 0 6px}
.mini{font-size:10.5px;line-height:1.4;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:30px 0}
footer{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;line-height:1.6;color:var(--mute);text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>템 <span>발견소</span></h1>
<p class="sub">영상에서 본 그 아이템, 여기 다 모아뒀어요 🔎</p>
</header>
<div class="search"><input id="q" type="search" placeholder="제목이나 키워드로 찾기 (예: 산타, 공)" autocomplete="off"></div>
<main id="list"><div class="empty">불러오는 중...</div></main>
<footer>이 페이지의 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</footer>
</div>
<script>
(function(){
var NOTICE="이 페이지의 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.";
var list=document.getElementById("list"),q=document.getElementById("q"),items=[];
function safe(u){return /^https?:\/\//.test(u||"")?u:""}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(){
  var k=q.value.trim().toLowerCase();
  var rows=items.filter(function(i){return !k||(i.title+" "+i.keyword).toLowerCase().indexOf(k)>=0});
  list.textContent="";
  if(!rows.length){list.appendChild(el("div","empty","찾는 영상이 없어요. 다른 키워드로 찾아보세요."));return}
  rows.forEach(function(i){
    var c=el("article","card"),img=el("img","thumb");
    img.src=i.thumb;img.alt=i.title;img.loading="lazy";
    var b=el("div","body");
    b.appendChild(el("div","date",i.date));
    b.appendChild(el("h2","title",i.title));
    if(i.keyword)b.appendChild(el("div","kw","댓글 키워드 '"+i.keyword+"'"));
    var bt=el("div","btns");
    (i.products||[]).forEach(function(p,n){
      if(p.name)bt.appendChild(el("p","pname",p.name+(p.note?" - "+p.note:"")));
      var u=safe(p.url);if(!u)return;
      var a=el("a","btn","제품 보러 가기");a.href=u;a.target="_blank";a.rel="noopener noreferrer sponsored";
      bt.appendChild(a);
    });
    var r=safe(i.reel);
    if(r){var ra=el("a","reel","릴스 다시 보기");ra.href=r;ra.target="_blank";ra.rel="noopener noreferrer";bt.appendChild(ra)}
    bt.appendChild(el("div","mini",NOTICE));
    b.appendChild(bt);c.appendChild(img);c.appendChild(b);list.appendChild(c);
  });
}
q.addEventListener("input",render);
fetch("data/items.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(d){
  items=(d.items||[]).slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)});render();
}).catch(function(){list.textContent="";list.appendChild(el("div","empty","목록을 불러오지 못했어요. 잠시 후 다시 열어주세요."))});
})();
</script>
</body>
</html>
